name: Production recovery drills

on:
  schedule:
    - cron: "17 3 1 * *"
    - cron: "43 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      drill:
        description: Drill to execute
        required: true
        type: choice
        options: [monthly_restore, quarterly_game_day]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  monthly-restore:
    if: github.event_name == 'schedule' && github.event.schedule == '17 3 1 * *' || inputs.drill == 'monthly_restore'
    runs-on: ubuntu-latest
    timeout-minutes: 250
    environment: production-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/run-recovery-drill.ts monthly_restore
        env:
          RECOVERY_AUTOMATION_URL: ${{ secrets.RECOVERY_AUTOMATION_URL }}
          RECOVERY_AUTOMATION_TOKEN: ${{ secrets.RECOVERY_AUTOMATION_TOKEN }}
          RECOVERY_EVIDENCE_PATH: monthly_restore.json
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-restore-evidence
          path: monthly_restore.json
          retention-days: 400

  quarterly-game-day:
    if: github.event_name == 'schedule' && github.event.schedule == '43 4 1 1,4,7,10 *' || inputs.drill == 'quarterly_game_day'
    runs-on: ubuntu-latest
    timeout-minutes: 250
    environment: production-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Assume recovery game-day authority
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: quarterly-production-recovery
          role-to-assume: ${{ vars.AWS_RECOVERY_GAME_DAY_ROLE_ARN }}
      - name: Rotate recovery game-day credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KMS_RECOVERY_GAME_DAY_KEY_ARN: ${{ vars.KMS_RECOVERY_GAME_DAY_KEY_ARN }}
        run: |
          jq -n \
            --arg access "$AWS_ACCESS_KEY_ID" \
            --arg secret "$AWS_SECRET_ACCESS_KEY" \
            --arg token "$AWS_SESSION_TOKEN" \
            --arg key "$KMS_RECOVERY_GAME_DAY_KEY_ARN" \
            '{AWS_ACCESS_KEY_ID:$access,AWS_SECRET_ACCESS_KEY:$secret,AWS_SESSION_TOKEN:$token,KMS_RECOVERY_GAME_DAY_KEY_ARN:$key}' \
            | bun x wrangler secret bulk \
                --name whatsapp-mcp-recovery-game-day
      - run: bun scripts/run-recovery-drill.ts quarterly_game_day
        env:
          RECOVERY_AUTOMATION_URL: ${{ secrets.RECOVERY_AUTOMATION_URL }}
          RECOVERY_AUTOMATION_TOKEN: ${{ secrets.RECOVERY_AUTOMATION_TOKEN }}
          RECOVERY_EVIDENCE_PATH: quarterly_game_day.json
      - uses: actions/upload-artifact@v4
        with:
          name: quarterly-game-day-evidence
          path: quarterly_game_day.json
          retention-days: 400
