name: Bootstrap production MCP smoke credential

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Assume the production MCP smoke credential role
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-mcp-smoke-bootstrap
          role-to-assume: ${{ vars.AWS_MCP_SMOKE_CREDENTIAL_ROLE_ARN }}
      - name: Bootstrap the current refresh credential
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_OAUTH_KV_ID: ${{ vars.CLOUDFLARE_OAUTH_KV_ID }}
          MCP_SMOKE_REFRESH_TOKEN: ${{ secrets.MCP_SMOKE_REFRESH_TOKEN }}
          MCP_SMOKE_REFRESH_SECRET_ID: ${{ vars.MCP_SMOKE_REFRESH_SECRET_ID }}
        run: |
          test -n "$MCP_SMOKE_REFRESH_TOKEN"
          test -n "$MCP_SMOKE_REFRESH_SECRET_ID"
          printf '%s' "$MCP_SMOKE_REFRESH_TOKEN" | aws secretsmanager put-secret-value \
            --secret-id "$MCP_SMOKE_REFRESH_SECRET_ID" \
            --secret-string file:///dev/stdin \
            >/dev/null
          node <<'NODE'
          const [subject, grant] = process.env.MCP_SMOKE_REFRESH_TOKEN.split(":");
          if (!subject || !grant) throw new Error("refresh credential format unavailable");
          const key = encodeURIComponent(`grant:${subject}:${grant}`);
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${process.env.CLOUDFLARE_OAUTH_KV_ID}/values/${key}`,
            { headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } },
          );
          if (!response.ok) throw new Error("OAuth grant lookup unavailable");
          const grantData = await response.json();
          if (typeof grantData.clientId !== "string")
            throw new Error("OAuth grant client unavailable");
          console.info(`MCP_SMOKE_CLIENT_ID=${grantData.clientId}`);
          NODE
