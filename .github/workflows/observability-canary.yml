name: Production alert delivery canary

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/send-observability-canary.ts
        env:
          PAGER_RECEIPT_TOKEN: ${{ secrets.PAGER_RECEIPT_TOKEN }}
          PAGER_RECEIPT_URL: ${{ secrets.PAGER_RECEIPT_URL }}
          PAGER_WEBHOOK_TOKEN: ${{ secrets.PAGER_WEBHOOK_TOKEN }}
          PAGER_WEBHOOK_URL: ${{ secrets.PAGER_WEBHOOK_URL }}
